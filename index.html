<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{--bg:#f5f5f7;--card:#ffffff;--inset:#eeeef0;--text:#1d1d1f;--text-2:#6e6e73;--text-3:#aeaeb2;--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--purple:#AF52DE;--yellow:#FFCC00;--radius:14px;--radius-sm:10px;--bdr:rgba(0,0,0,0.08);--bdr2:rgba(0,0,0,0.14)}
.container{max-width:480px;margin:0 auto;padding:0 16px 80px}
.header{position:sticky;top:0;z-index:100;background:rgba(245,245,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--red));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.header-title{font-size:15px;font-weight:600;color:var(--text)}
.header-sub{font-size:11px;color:var(--text-2);margin-top:1px}
.header-date{font-size:11px;color:var(--text-3);text-align:right}
.main-tabs{position:sticky;top:56px;z-index:99;background:rgba(245,245,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;gap:6px;padding:10px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--bdr)}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;cursor:pointer}
.main-tab.active{color:var(--text);background:var(--card);border-color:var(--bdr2)}
.main-panel{display:none}
.main-panel.active{display:block}
.sub-tabs{display:flex;gap:6px;padding:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;cursor:pointer}
.sub-tab.active{color:var(--text);background:var(--card);border-color:var(--bdr2)}
.sub-panel{display:none}
.sub-panel.active{display:block;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;border:1px solid var(--bdr)}
.card-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.day-summary{background:var(--inset);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.day-summary .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.day-summary .row:last-child{margin-bottom:0}
.day-summary .label{font-size:12px;color:var(--text-2)}
.day-summary .val{font-size:16px;font-weight:700}
.jige-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.jige-chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap;line-height:1.5}
.jige-chip.sanqi{background:rgba(255,204,0,0.25);color:#B8860B;border:1px solid rgba(255,204,0,0.4)}
.jige-chip.dun{background:rgba(0,122,255,0.12);color:var(--blue);border:1px solid rgba(0,122,255,0.3)}
.jige-chip.yunu{background:rgba(175,82,222,0.12);color:var(--purple);border:1px solid rgba(175,82,222,0.3)}
.jige-chip.normal{background:rgba(52,199,89,0.12);color:var(--green);border:1px solid rgba(52,199,89,0.25)}
.jige-count{font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(255,204,0,0.25);color:#B8860B;margin-left:4px}
input[type="date"],input[type="number"],input[type="text"],select{background:var(--inset)!important;color:var(--text)!important;border:1px solid var(--bdr2)!important;font-family:inherit}
input::placeholder{color:var(--text-3)}

/* ===== 训练模块 ===== */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-item{background:var(--inset);border-radius:var(--radius-sm);padding:12px 14px}
.goal-label{font-size:11px;color:var(--text-3);margin-bottom:2px}
.goal-val{font-size:22px;font-weight:800;color:var(--text);line-height:1.2}
.goal-val .u{font-size:12px;font-weight:500;color:var(--text-2);margin-left:2px}
.goal-cur{font-size:11px;color:var(--text-2);margin-top:2px}
.goal-cur b{color:var(--blue);font-weight:600}
.eta-bar{margin-top:12px;padding:10px 12px;background:rgba(0,122,255,0.07);border-radius:10px;font-size:11.5px;color:var(--text-2);line-height:1.7}
.eta-bar b{color:var(--blue);font-weight:700}
details.entry{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
details.entry>summary{list-style:none;cursor:pointer;padding:14px 18px;font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:space-between}
details.entry>summary::-webkit-details-marker{display:none}
details.entry>summary::after{content:'＋';font-size:15px;color:var(--text-3);font-weight:400}
details.entry[open]>summary::after{content:'－'}
details.entry>summary .hint{font-size:11px;font-weight:400;color:var(--text-3);margin-left:auto;margin-right:10px}
.entry-body{padding:0 18px 16px;border-top:1px solid var(--bdr);padding-top:14px}
.inp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.inp-row label{font-size:12px;color:var(--text-2);width:76px;flex-shrink:0}
.inp-row input{flex:1;padding:9px 11px;border-radius:8px;font-size:14px;outline:none;width:100%}
.btn-save{width:100%;padding:10px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:2px}
.recent-line{font-size:11px;color:var(--text-3);margin-top:10px;line-height:1.7}
.recent-line b{color:var(--text-2);font-weight:600}

.plan-card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;border:1px solid var(--bdr);position:relative}
.plan-card.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,122,255,0.10)}
.plan-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.plan-day{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:0.5px}
.plan-name{font-size:17px;font-weight:700;color:var(--text);margin-top:1px}
.plan-focus{font-size:11.5px;color:var(--text-3);margin-top:2px}
.plan-dur{font-size:11px;color:var(--text-2);background:var(--inset);border-radius:10px;padding:3px 9px;white-space:nowrap;flex-shrink:0}
.today-badge{position:absolute;top:-9px;right:14px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:2px 9px;border-radius:9px}
.plan-sec{font-size:11px;font-weight:700;color:var(--text-3);margin:14px 0 8px;letter-spacing:0.4px}
.lb-box{background:rgba(255,149,0,0.08);border-radius:10px;padding:10px 12px;margin-bottom:4px}
.lb-item{display:flex;gap:8px;font-size:12px;color:var(--text-2);line-height:1.6;padding:3px 0}
.lb-item .n{font-weight:600;color:var(--text);flex-shrink:0}
.lb-item .s{color:var(--orange);font-weight:600;flex-shrink:0;font-size:11px}
.act-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.act-item:last-child{border-bottom:none}
.act-idx{width:20px;height:20px;border-radius:6px;background:var(--inset);color:var(--text-2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.act-body{flex:1;min-width:0}
.act-name{font-size:13.5px;font-weight:600;color:var(--text)}
.act-spec{font-size:11.5px;color:var(--blue);font-weight:600;margin-top:1px}
.act-tip{font-size:11px;color:var(--text-3);line-height:1.6;margin-top:3px}
.plan-foot{font-size:11px;color:var(--text-3);line-height:1.7;margin-top:12px;padding-top:10px;border-top:1px dashed var(--bdr)}
.warn-box{background:rgba(255,59,48,0.07);border-left:3px solid var(--red);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--text-2);line-height:1.75;margin-top:12px}
</style>
</head>

const GONG_POS={1:0,4:0,3:1,2:2,5:2,8:2,7:3,6:4,9:4};
// ===== 实测校准日志（主人翻牌实测反馈）=====

function getXun(hg,hz){const g=TG.indexOf(hg),z=DZ.indexOf(hz);for(let n=0;n<60;n++)if(n%10===g&&n%12===z)return XUN[Math.floor(n/10)];return null;}
function getKongWang(hg,hz){const x=getXun(hg,hz);const KW={'甲子':['戌','亥'],'甲戌':['申','酉'],'甲申':['午','未'],'甲午':['辰','巳'],'甲辰':['寅','卯'],'甲寅':['子','丑']};return KW[x];}
function getJieqiYuan(s){const d=new Date(s+'T00:00:00');let jq=null,jd=null;for(const[x,n]of JQ_DATES){if(x<=d){jq=n;jd=x;}else if(jq===null){jq=n;jd=x;break;}}const ds=Math.floor((d-jd)/86400000);return{jq,yuan:['上元','中元','下元'][Math.floor(ds/5)%3]};}
function getJu(jq,yuan){return JQ_JU[jq][['上元','中元','下元'].indexOf(yuan)];}
// 九宫飞布
function flyGong(ju,isYang){const LY=['戊','己','庚','辛','壬','癸','丁','丙','乙'];const od=[];let p=ju;for(let i=0;i<9;i++){od.push(p);p=isYang?(p%9+1):((p-2+9)%9+1);}const dp={};for(let i=0;i<9;i++)dp[od[i]]=LY[i];return dp;}
function getTianpan(dp,hg,hz,isYang){const x=getXun(hg,hz);const dg=DUN[x];let zg=1;for(const[g,gn]of Object.entries(dp))if(gn===dg){zg=parseInt(g);break;}if(zg===5)zg=2;let sg=zg;for(const[g,gn]of Object.entries(dp))if(gn===hg){sg=parseInt(g);break;}const fly=[1,2,3,4,5,6,7,8,9];const zi=fly.indexOf(zg),si=fly.indexOf(sg);let off=0;if(hg!=='甲')off=isYang?((si-zi)%9+9)%9:((zi-si)%9+9)%9;const tp={};for(let i=0;i<9;i++){const dst=isYang?fly[(i+off)%9]:fly[((i-off)%9+9)%9];tp[dst]=dp[fly[i]];}return{tpan:tp,zhifuGong:zg};}
function getBamen(zg,hg,hz,isYang){const x=getXun(hg,hz);const MO={1:'休',8:'生',3:'伤',4:'杜',9:'景',2:'死',7:'惊',6:'开'};const zm=MO[zg]||'休';const xc=XUN.indexOf(x)+1;const MR={};for(const[k,v]of Object.entries(MO))MR[v]=parseInt(k);const zog=MR[zm];const f8=[1,2,3,4,6,7,8,9];const oi=f8.indexOf(zog);let zsg=oi>=0?(isYang?f8[(oi+xc)%8]:f8[((oi-xc)%8+8)%8]):(isYang?f8[xc%8]:f8[((-xc)%8+8)%8]);const MS=['休','生','伤','杜','景','死','惊','开'];const mp={};const ti=f8.indexOf(zsg);for(let i=0;i<MS.length;i++){mp[isYang?f8[(ti+i)%8]:f8[((ti-i)%8+8)%8]]=MS[i];}return mp;}
function getBashen(zg,isYang){const f8=[1,2,3,4,6,7,8,9];const sp={};const ti=f8.indexOf(zg);for(let i=0;i<SHEN.length;i++){sp[isYang?f8[(ti+i)%8]:f8[((ti-i)%8+8)%8]]=SHEN[i];}return sp;}
// 格局判断
function checkGeju(dp,tp,mp,sp,hg,hz){
  const tags=[];let f=false;const fr=[];
  const x=getXun(hg,hz);const dg=DUN[x];
  let sg=null;for(const[g,gn]of Object.entries(dp))if(gn===hg){sg=parseInt(g);break;}
  if(hg==='甲')for(const[g,gn]of Object.entries(dp))if(gn===dg){sg=parseInt(g);break;}
  if(sg===5)sg=2;
  // 凶格过滤
  if(sg&&mp[sg]){const m=mp[sg];if(WX_KE[MEN_WX[m]]===GONG_WX[sg]){f=true;fr.push('门迫');}}
  const kw=getKongWang(hg,hz);const kg=kw.map(z=>{let g=ZHI_GONG[z];return g===5?2:g;});
  if(sg&&kg.includes(sg)){f=true;fr.push('空亡');}
  if(sg){const tg=tp[sg];if(XING_MAP[tg]===sg){f=true;fr.push('击刑');}}
  // 吉格判定——遍历九宫
  for(const g of Object.keys(tp)){
    const gi=parseInt(g);if(gi===5)continue;
    const tg=tp[g],dgn=dp[g],m=mp[g],sh=sp[g];
    // 三奇得使：天盘乙丙丁+地盘旬首遁干
    if(['乙','丙','丁'].includes(tg)&&dgn===dg)tags.push('三奇得使('+tg+')');
    // 玉女守门：丁+开门
    if(tg==='丁'&&m==='开')tags.push('玉女守门');
    // 人遁：丁+休门+太阴
    if(tg==='丁'&&m==='休'&&sh==='太阴')tags.push('人遁');
    // 天遁：丙+生门+地盘丁
    if(tg==='丙'&&m==='生'&&dgn==='丁')tags.push('天遁');
    // 地遁：乙+开门+地盘己
    if(tg==='乙'&&m==='开'&&dgn==='己')tags.push('地遁');
    // 神遁：丙+生门+九天
    if(tg==='丙'&&m==='生'&&sh==='九天')tags.push('神遁');
    // 鬼遁：丁+杜门+九地 或 丁+开门+九地
    if(tg==='丁'&&(m==='杜'||m==='开')&&sh==='九地')tags.push('鬼遁');
    // 龙遁：乙+开/休/生+地盘癸或坎宫
    if(tg==='乙'&&(m==='开'||m==='休'||m==='生')&&(dgn==='癸'||gi===1))tags.push('龙遁');
    // 虎遁：乙+休/生+地盘辛+艮宫
    if(tg==='乙'&&(m==='休'||m==='生')&&dgn==='辛'&&gi===8)tags.push('虎遁');
    // 三诈：三吉门(开/休/生)+三奇(乙/丙/丁)+八神
    if((m==='开'||m==='休'||m==='生')&&['乙','丙','丁'].includes(tg)){
      if(sh==='太阴')tags.push('真诈');
      else if(sh==='九地')tags.push('重诈');
      else if(sh==='六合')tags.push('休诈');
    }
    // 三奇升殿：乙临震3宫/丙临离9宫/丁临兑7宫
    if(tg==='乙'&&gi===3)tags.push('乙奇升殿');
    if(tg==='丙'&&gi===9)tags.push('丙奇升殿');
    if(tg==='丁'&&gi===7)tags.push('丁奇升殿');
  }
  // 去重
  const ut=[...new Set(tags)];
  // 每个宫的吉格映射（翻牌建议要求：位置/门/神/格必须是同一个宫）
  const tagMap={};
  for(const g of Object.keys(tp)){
    const gi=parseInt(g);if(gi===5)continue;
    const tg=tp[g],dgn=dp[g],m=mp[g],sh=sp[g];const gt=[];
    if(['乙','丙','丁'].includes(tg)&&dgn===dg)gt.push('三奇得使('+tg+')');
    if(tg==='丁'&&m==='开')gt.push('玉女守门');
    if(tg==='丁'&&m==='休'&&sh==='太阴')gt.push('人遁');
    if(tg==='丙'&&m==='生'&&dgn==='丁')gt.push('天遁');
    if(tg==='乙'&&m==='开'&&dgn==='己')gt.push('地遁');
    if(tg==='丙'&&m==='生'&&sh==='九天')gt.push('神遁');
    if(tg==='丁'&&(m==='杜'||m==='开')&&sh==='九地')gt.push('鬼遁');
    if(tg==='乙'&&(m==='开'||m==='休'||m==='生')&&(dgn==='癸'||gi===1))gt.push('龙遁');
    if(tg==='乙'&&(m==='休'||m==='生')&&dgn==='辛'&&gi===8)gt.push('虎遁');
    if((m==='开'||m==='休'||m==='生')&&['乙','丙','丁'].includes(tg)){
      if(sh==='太阴')gt.push('真诈');else if(sh==='九地')gt.push('重诈');else if(sh==='六合')gt.push('休诈');
    }
    if(tg==='乙'&&gi===3)gt.push('乙奇升殿');
    if(tg==='丙'&&gi===9)gt.push('丙奇升殿');
    if(tg==='丁'&&gi===7)gt.push('丁奇升殿');
    if(gt.length)tagMap[gi]=[...new Set(gt)];
  }
  return{tags:ut,isFiltered:f,filterReason:fr,shiganGong:sg,tagMap:tagMap};
}
// 主排盘（原始——基于当前日期日干）
function paiPan(ds,hz){const dg=getDayGZ(ds);const hg=getHourGZ(dg.gan,hz);const{jq,yuan}=getJieqiYuan(ds);const ju=getJu(jq,yuan);const isYang=YANG_DUN.has(jq);const dp=flyGong(ju,isYang);const{tpan,zhifuGong}=getTianpan(dp,hg.gan,hz,isYang);const mp=getBamen(zhifuGong,hg.gan,hz,isYang);const sp=getBashen(zhifuGong,isYang);const{tags,isFiltered,filterReason,shiganGong,tagMap}=checkGeju(dp,tpan,mp,sp,hg.gan,hz);return{date:ds,hourZhi:hz,dayGz:dg.gz,hourGz:hg.gz,jq,yuan,ju,isYang,shiganGong,tpanGan:tpan[shiganGong]||'?',menAtGong:mp[shiganGong]||'?',shenAtGong:sp[shiganGong]||'?',shenMap:sp,menMap:mp,tpanMap:tpan,tagMap:tagMap,tags,isFiltered,filterReason};}
// 账号独立排盘——用账号建号日的日干替代当前日期日干，实现每账号独立排盘
// 节气/局数仍基于当前日期 ds（局数按节气走），但日干/时干基于账号建号日
function paiPanForAccount(ds,hz,accountDayGan){
  // 用账号日干计算时干（五鼠遁日起时）
  const hg=getHourGZ(accountDayGan,hz);
  // 节气/局数基于当前日期
  const{jq,yuan}=getJieqiYuan(ds);
  const ju=getJu(jq,yuan);
  const isYang=YANG_DUN.has(jq);
  const dp=flyGong(ju,isYang);
  // 天盘旋转基于账号时干
  const{tpan,zhifuGong}=getTianpan(dp,hg.gan,hz,isYang);
  const mp=getBamen(zhifuGong,hg.gan,hz,isYang);
  const sp=getBashen(zhifuGong,isYang);
  const{tags,isFiltered,filterReason,shiganGong,tagMap}=checkGeju(dp,tpan,mp,sp,hg.gan,hz);
  return{date:ds,hourZhi:hz,dayGz:accountDayGan,hourGz:hg.gz,jq,yuan,ju,isYang,shiganGong,tpanGan:tpan[shiganGong]||'?',menAtGong:mp[shiganGong]||'?',shenAtGong:sp[shiganGong]||'?',shenMap:sp,menMap:mp,tpanMap:tpan,tagMap:tagMap,tags,isFiltered,filterReason};
}
function getAccountRg(cs){return getDayGZ(cs.slice(0,10)).gan;}
// 周排盘
function getWeekDates(){const t=new Date();const dow=t.getDay()||7;const m=new Date(t);m.setDate(m.getDate()-dow+1);const dates=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}return dates;}
function getWeekNumber(){const t=new Date();const s=new Date(t.getFullYear(),0,1);return Math.ceil(((t-s)/86400000+s.getDay()+1)/7);}
function generateWeekSchedule(){
  const dates=getWeekDates();
  const accounts=PZ_ACCOUNTS.map(a=>({...a,rg:getAccountRg(a.created),isSanqi:['乙','丙','丁'].includes(getAccountRg(a.created))}));
  const days=[],recommend={},filtered={};
  accounts.forEach(a=>{recommend[a.name]=[];filtered[a.name]=[];});
  const wdN='一二三四五六日';
  dates.forEach(dateStr=>{
    const d=new Date(dateStr+'T00:00:00');

    const isWeekend=wd>=6;
    const sample=paiPan(dateStr,'子');
    const dg=getDayGZ(dateStr);
    const hg=getHourGZ(dg.gan,'子');
    const kw=getKongWang(hg.gan,'子');
    days.push({dt:dateStr.slice(5).replace('-','/'),wd:wdN[wd-1],dateStr,gz:sample.dayGz,jq:sample.jq,yuan:sample.yuan,ju:sample.ju,isYang:sample.isYang,isWeekend,kwStr:kw.join('')});
    const hours=isWeekend?['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥']:['戌','亥','子'];
    accounts.forEach(a=>{
      const ganWx=GAN_WX[a.rg]||'土';
      hours.forEach(hz=>{
        if([1,3,4].includes(wd)&&hz==='亥')return;
        // 关键改动：每个账号用自己的建号日干独立排盘
        const r=paiPanForAccount(dateStr,hz,a.rg);
        const entry={dateStr,dt:dateStr.slice(5).replace('-','/')+'('+wdN[wd-1]+')',t:HOUR_LABELS[hz],gong:GONG_NM[r.shiganGong]||'?',men:r.menAtGong+'门',tag:r.tags.join('+'),pri:r.tags.length>0?'A':'B',shiganGan:r.tpanGan,shen:r.shenAtGong};
        // 计算该账号日干与时干落宫的生克分（差异化关键）
        const sg=r.shiganGong;
        const gongWx=GONG_WX[sg]||'土';
        entry.wxScore=wxScore(gongWx,ganWx);
        entry.gongWx=gongWx;
        entry.ganWx=ganWx;
        if(r.isFiltered){filtered[a.name].push({...entry,reason:r.filterReason[0]});}
        else{let sqm=false;if(a.isSanqi)r.tags.forEach(t=>{if(t.includes('三奇得使')&&t.includes(a.rg))sqm=true;});entry.sanqiMatch=sqm;recommend[a.name].push(entry);}
      });
    });
  });
  return{accounts,days,recommend,filtered};
}
// 判断排盘条目是否在未来（基于 dateStr 和时辰）
function getHourRange(t){
  const m=t.match(/(\d+)-(\d+)/);
  if(!m)return[0,24];
  let s=parseInt(m[1]),e=parseInt(m[2]);
  if(e<s)e+=24; // 跨子时
  return[s,e];
}
function isFutureEntry(entry){
  const now=new Date();
  const d=new Date(entry.dateStr+'T00:00:00');
  const todayStr=localTodayStr();
  if(entry.dateStr>todayStr)return true;
  if(entry.dateStr<todayStr)return false;
  const[hs,he]=getHourRange(entry.t);
  const curH=now.getHours()+now.getMinutes()/60;
  // 跨子时条目（23-01），结束小时为25；只要当前小时<结束小时即可
  return curH<he;
}
// 翻牌建议——基于当前时辰实时排盘，每个账号独立排盘+差异化推荐
function generateFlipAdvice(schedule){
  const advice={};
  const PN=['左一','左二','中','右二','右一'];
  const SR={'值符':5,'九天':4,'太阴':3,'六合':3,'九地':2,'白虎':1,'玄武':1,'腾蛇':0};
  // 获取当前时辰
  const now=new Date();
  const h=now.getHours();
  const hzMap={23:'子',0:'子',1:'丑',2:'丑',3:'寅',4:'寅',5:'卯',6:'卯',7:'辰',8:'辰',9:'巳',10:'巳',11:'午',12:'午',13:'未',14:'未',15:'申',16:'申',17:'酉',18:'酉',19:'戌',20:'戌',21:'亥',22:'亥'};
  const curHz=hzMap[h]||'子';
  const todayStr=localTodayStr();
  const curLabel=HOUR_LABELS[curHz]||curHz;
  // 关键改动：每个账号独立排盘，不再共享
  schedule.accounts.forEach(a=>{
    const r=paiPanForAccount(todayStr,curHz,a.rg); // 每个账号用自己的建号日干排盘
    const entry={dateStr:todayStr,dt:todayStr.slice(5).replace('-','/'),t:curLabel,gong:GONG_NM[r.shiganGong]||'?',men:r.menAtGong+'门',tag:r.tags.join('+'),shen:r.shenAtGong};
    // 当前时辰是否被过滤（凶格）
    if(r.isFiltered){
      advice[a.name]={pos:'暂缓',posIdx:undefined,isPast:false,bestTime:'当前 '+curLabel,gong:entry.gong,men:entry.men,tag:entry.tag||'无吉格',shen:entry.shen,reason:'当前时辰'+r.filterReason.join('+')+'，不宜翻牌，建议等下一个吉时'};
      return;
    }
    // ===== 日干差异化翻牌位置（自洽版）=====
    // 评分只看"八神权重 + 该宫对日干生克 + 该宫吉格加成"，位置/门/神/格全部取自同一个宫
    const ganWx=GAN_WX[a.rg]||'土';
    let bestShen=null,bestScore=-99,bestGong=null;
    for(const[gongNum,shenName] of Object.entries(r.shenMap)){
      const gn=parseInt(gongNum);
      if(gn===5)continue; // 中宫无八神
      const sr=SR[shenName]||0;
      const gongWx=GONG_WX[gn]||'土';
      const ws=wxScore(gongWx,ganWx);
      // 吉格加成：这个宫自己带吉格才加分（位置与格一致的关键）
      const gTags=(r.tagMap&&r.tagMap[gn])||[];
      const tgBonus=gTags.length*3;
      const score=sr+ws+tgBonus;
      if(score>bestScore){bestScore=score;bestShen=shenName;bestGong=gn;}
    }
    // 该宫自己的门/天盘干/吉格——不再借用时干宫的
    const bestGongNm=GONG_NM[bestGong]||'?';
    const bestMen=(r.menMap&&r.menMap[bestGong]?r.menMap[bestGong]:'?')+'门';
    const bestTags=(r.tagMap&&r.tagMap[bestGong])||[];
    const pi=GONG_POS[bestGong]!==undefined?GONG_POS[bestGong]:2;
    const sqMatch=a.isSanqi&&bestTags.some(t=>t.includes('三奇得使')&&t.includes(a.rg));
    const wxDesc=bestScore>=9?'大吉':bestScore>=6?'吉':bestScore>=3?'小吉':bestScore>=0?'平':'慎';
    advice[a.name]={pos:PN[pi],posIdx:pi,isPast:false,bestTime:'当前 '+curLabel,
      gong:bestGongNm,men:bestMen,tag:bestTags.length?bestTags.join('+'):'★吉位',shen:bestShen,
      reason:bestShen+'加临'+bestGongNm+'（'+wxDesc+'，综合分'+bestScore+'），该宫'+bestMen+(bestTags.length?'，'+bestTags.join('、'):'')
      +(sqMatch?'，三奇得使⚡':'')+'，日干'+a.rg+'('+ganWx+')与宫'+GONG_WX[bestGong]+'('+gongWxLabel(ganWx,GONG_WX[bestGong])+')'};
  });
  return advice;
}
// 生克关系文字
function gongWxLabel(ganWx,gongWx){
  if(ganWx===gongWx)return '比和';
  const sheng={'木':'火','火':'土','土':'金','金':'水','水':'木'};
  if(sheng[gongWx]===ganWx)return '宫生日干';
  if(sheng[ganWx]===gongWx)return '日生宫';
  const ke={'木':'土','土':'水','水':'火','火':'金','金':'木'};
  if(ke[gongWx]===ganWx)return '宫克日干';
  if(ke[ganWx]===gongWx)return '日克宫';
  return '无';
}

// 吉格标签渲染：把 tag 字符串拆成多个 chip
function renderJigeChips(tagStr){
  if(!tagStr) return '<span class="jige-chip normal">★吉门</span>';
  const parts = tagStr.split('+').filter(s => s.trim());
  if(parts.length === 0) return '<span class="jige-chip normal">★吉门</span>';
  return parts.map(p => {
    const t = p.trim();
    let cls = 'normal';
    if(t.includes('三奇得使')||t.includes('升殿')) cls = 'sanqi';
    else if(t.includes('遁')) cls = 'dun';
    else if(t.includes('玉女守门')) cls = 'yunu';
    else if(t.includes('诈')) cls = 'yunu';
    return '<span class="jige-chip '+cls+'">'+t.replace(/★/g,'')+'</span>';
  }).join('');
}

    if(!jqGroups[key]) jqGroups[key] = {days:[], ju:d.ju, isYang:d.isYang, jq:d.jq, yuan:d.yuan};

  });

    const yd = g.isYang ? '阳' : '阴';
    const color = g.isYang ? 'var(--orange)' : 'var(--purple)';

  });
  html += `</div></div>`;

  // 翻牌建议总览（基于当前时辰实时排盘）
  html += `<div class="card">
    <div class="card-title">🃏 翻牌建议（当前时辰）</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:10px">根据当前时辰八神位置推荐翻牌，实时更新</div>`;
  sch.accounts.forEach(a => {
    const adv = flipAdvice[a.name];
    const sqTag = a.isSanqi ? '<span style="color:var(--yellow);font-size:11px;margin-left:6px">⚡三奇</span>' : '';
    html += `<div style="background:var(--inset);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;border-left:4px solid ${adv.posIdx!==undefined?'var(--blue)':'var(--red)'}">

    if(adv.posIdx !== undefined){
      html += `<div style="display:flex;align-items:center;gap:8px;margin:6px 0">

        <div style="font-size:18px;font-weight:700;color:var(--blue)">${adv.pos}</div>

      <div style="font-size:12px;color:var(--text-2)">⏰ ${adv.bestTime} · ${adv.shen}加临${adv.gong}</div>

      html += `<div style="font-size:12px;color:var(--red)">⚠️ ${adv.reason}</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;

  // 每个账号的推荐时段
  sch.accounts.forEach(acc => {
    const recs = sch.recommend[acc.name] || [];
    const future = recs.filter(isFutureEntry);
    // 排序：吉格数量 > 日干生克分 > 三奇得使
    const sortByJige = (a,b) => {
      const ja = jigeCount(a.tag), jb = jigeCount(b.tag);
      if(jb !== ja) return jb - ja;
      const wa = a.wxScore||0, wb = b.wxScore||0;
      if(wb !== wa) return wb - wa;
      if(a.sanqiMatch && !b.sanqiMatch) return -1;
      if(!a.sanqiMatch && b.sanqiMatch) return 1;
      return 0;
    };
    const sortedFuture = future.slice().sort(sortByJige);
    const sortedAll = recs.slice().sort(sortByJige);
    const best = sortedFuture[0] || sortedAll[0];
    const sqTag = acc.isSanqi ? '<span style="color:var(--yellow);font-size:11px;margin-left:6px">⚡三奇</span>' : '';
    html += `<div class="card">
      <div class="card-title">${acc.icon} ${acc.name}（${acc.school}·日干${acc.rg}）${sqTag}</div>`;
    if (best) {
      const isPast = !isFutureEntry(best);
      const jc = jigeCount(best.tag);
      const isSqMatch = best.sanqiMatch;
      const borderColor = isSqMatch ? 'var(--yellow)' : (jc >= 2 ? 'var(--yellow)' : 'var(--green)');
      const label = isPast ? '🕓 最近可用' : '🎯 首选';
      const buffBadge = jc >= 2 ? '<span class="jige-count">'+jc+'重buff</span>' : '';
      html += `<div style="background:var(--inset);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;border-left:4px solid ${borderColor}">
        <div style="font-size:11px;color:var(--text-3);margin-bottom:4px">${label}${isSqMatch?' ⚡三奇得使':''}${buffBadge}${isPast?' <span style="color:var(--red)">(已过期)</span>':''}</div>

        <div class="jige-chips">${renderJigeChips(best.tag)}</div>
      </div>`;
    }
    const displayRecs = sortedFuture.length > 0 ? sortedFuture : sortedAll;
    if (displayRecs.length > 0) {
      const showAll = displayRecs.length <= 8;
      html += `<div style="font-size:12px;color:var(--text-2);margin-bottom:6px">${sortedFuture.length > 0 ? '未来可用' : '全部可用'} ${displayRecs.length} 个时段（按吉格数+日干生克排序）：</div>`;
      displayRecs.forEach((r, idx) => {
        if(!showAll && idx >= 6){
          return;
        }
        const c = r.sanqiMatch ? 'var(--yellow)' : (r.pri === 'A' ? 'var(--yellow)' : 'var(--text-2)');
        const sqIcon = r.sanqiMatch ? '⚡' : '';
        const jc = jigeCount(r.tag);
        const buffBadge = jc >= 2 ? '<span class="jige-count">'+jc+'重</span>' : '';
        const wxColor=(r.wxScore||0)>=2?'var(--green)':(r.wxScore||0)<0?'var(--red)':'var(--text-3)';
        const wxStr='<span style="color:'+wxColor+';font-size:10px">'+(r.wxScore>=0?'+':'')+r.wxScore+'</span>';
        html += `<div style="font-size:12px;color:var(--text-3);padding:6px 0;border-bottom:1px solid var(--bdr)">
          <div style="display:flex;align-items:center;gap:4px"><span style="color:${c};font-weight:600">${sqIcon}${r.dt}</span> ${r.t} · ${r.gong}${r.men} · ${r.shen}${buffBadge} ${wxStr}</div>
          <div class="jige-chips">${renderJigeChips(r.tag)}</div>
        </div>`;
      });
      if(!showAll){
        html += `<div style="font-size:11px;color:var(--text-3);margin-top:4px">等 ${displayRecs.length - 6} 个更多时段，详见吉时表...</div>`;
      }
    } else {
      html += `<div style="font-size:13px;color:var(--red);padding:10px 0">⚠️ 本周无可用吉时</div>`;
    }
    html += `</div>`;
  });

  // 凶格过滤汇总
  const totalFiltered = Object.values(sch.filtered).reduce((s, a) => s + a.length, 0);
  html += `<div class="card">
    <div class="card-title" style="color:var(--red)">⚠️ 凶格过滤</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:8px">共排除 ${totalFiltered} 个吉门时段（门迫/空亡/击刑）</div>`;

  });
  html += `</div>`;

  document.getElementById('sub-pz-recommend').innerHTML = html;
}

// ===================== 通用 =====================
function localTodayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function $id(id){return document.getElementById(id);}
function toast(msg){
  let el=$id('wbToast');
  if(!el){
    el=document.createElement('div');el.id='wbToast';
    el.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.82);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;z-index:9999;pointer-events:none;transition:opacity 0.35s;text-align:center;max-width:80vw';
    document.body.appendChild(el);
  }
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity='0';},1600);
}
function switchMain(name){
  document.querySelectorAll('.main-tab').forEach(function(el){el.classList.toggle('active',el.dataset.main===name);});
  document.querySelectorAll('.main-panel').forEach(function(el){el.classList.toggle('active',el.id==='panel-'+name);});
  if(name==='paipan'){
    _pzSchedule=null; // 每次进入重算，避免跨天/跨时辰用旧盘
    renderPZRecommend();renderPZDetail();renderPZInfo();
  }
}
function switchSub(name){
  if(name==='pz-recommend')renderPZRecommend();
  else if(name==='pz-detail')renderPZDetail();
  else if(name==='pz-info')renderPZInfo();
  document.querySelectorAll('.sub-tab').forEach(function(el){el.classList.toggle('active',el.dataset.sub===name);});
  document.querySelectorAll('.sub-panel').forEach(function(el){el.classList.toggle('active',el.id==='sub-'+name);});
}

  return SEED.slice();

  const a=getBody().slice().sort(function(x,y){return x.date.localeCompare(y.date);});
  return a[a.length-1]||{};

  const today=localTodayStr();

  else{a.push(Object.assign({date:today},obj));}

  renderGoal();renderEntry();
  toast('已记录 '+today.slice(5).replace('-','/'));
}

  const d0=new Date(RATE_START.date+'T00:00:00');
  const d1=new Date(lb.date+'T00:00:00');
  const days=Math.max(1,Math.round((d1-d0)/86400000));
  const rate=(RATE_START.w-w)/(days/7); // kg/周
  if(rate<=0)return null;
  return {rate:rate,daysLeft:Math.round((w-GOALS.weight)/rate*7),date:lb.date,w:w};
}
function renderGoal(){
  const lb=latestBody(),eta=calcEta();
  const fmt=function(v,u){return v==null?'<span style="color:var(--text-3);font-size:15px">未记录</span>':v+'<span class="u">'+u+'</span>';};
  let html='<div class="card" style="margin-top:12px">'+
    '<div class="card-title">🎯 整体目标参考</div>'+
    '<div class="goal-grid">'+
      '<div class="goal-item"><div class="goal-label">理想体重</div><div class="goal-val">'+GOALS.weight+'<span class="u">kg</span></div><div class="goal-cur">当前 <b>'+fmt(lb.weight,'kg').replace(/<[^>]+>/g,'')+'</b></div></div>'+
      '<div class="goal-item"><div class="goal-label">理想体脂率</div><div class="goal-val">'+GOALS.bf+'<span class="u">%</span></div><div class="goal-cur">当前 <b>'+fmt(lb.bf,'%').replace(/<[^>]+>/g,'')+'</b></div></div>'+
      '<div class="goal-item"><div class="goal-label">理想腰围</div><div class="goal-val">'+GOALS.waist+'<span class="u">cm</span></div><div class="goal-cur">当前 <b>'+fmt(lb.waist,'cm').replace(/<[^>]+>/g,'')+'</b></div></div>'+
      '<div class="goal-item"><div class="goal-label">理想去脂体重</div><div class="goal-val">'+GOALS.ffm+'<span class="u">kg</span></div><div class="goal-cur">当前 <b>'+fmt(lb.ffm,'kg').replace(/<[^>]+>/g,'')+'</b></div></div>'+
    '</div>';
  if(eta){
    const etaDate=new Date();etaDate.setDate(etaDate.getDate()+eta.daysLeft);
    const ds=(etaDate.getMonth()+1)+'月'+etaDate.getDate()+'日';
    html+='<div class="eta-bar">按 6/7 至今速率（<b>'+eta.rate.toFixed(2)+' kg/周</b>），预计还需 <b>'+eta.daysLeft+' 天</b>（约 '+ds+'）到 '+GOALS.weight+'kg</div>';
  }else if(lb.weight&&parseFloat(lb.weight)<=GOALS.weight){
    html+='<div class="eta-bar">已到达目标区间，保持即可。</div>';
  }else{
    html+='<div class="eta-bar">记一次体重就能算出预计天数。</div>';
  }
  html+='</div>';
  $id('goalCard').innerHTML=html;
}

// ===================== 极简录入 =====================
function renderEntry(){
  const lb=latestBody();
  const a=getBody().slice().sort(function(x,y){return y.date.localeCompare(x.date);}).slice(0,3);
  const recent=a.map(function(r){
    const p=[];
    if(r.weight!=null)p.push(r.weight+'kg');
    if(r.bf!=null)p.push(r.bf+'%');
    if(r.ffm!=null)p.push('去脂'+r.ffm);
    if(r.waist!=null)p.push('腰'+r.waist);
    return r.date.slice(5).replace('-','/')+' '+p.join(' · ');
  }).join('<br>');
  $id('entryArea').innerHTML=
    '<details class="entry"><summary>⚖️ 体重 / 体脂率 / 去脂体重<span class="hint">'+ (lb.weight!=null?lb.weight+'kg':'未记录') +'</span></summary>'+
      '<div class="entry-body">'+
        '<div class="inp-row"><label>体重</label><input type="number" step="0.05" id="inW" placeholder="77.7" value="'+(lb.weight!=null?lb.weight:'')+'"><span style="font-size:12px;color:var(--text-3)">kg</span></div>'+
        '<div class="inp-row"><label>体脂率</label><input type="number" step="0.1" id="inBF" placeholder="25.8" value="'+(lb.bf!=null?lb.bf:'')+'"><span style="font-size:12px;color:var(--text-3)">%</span></div>'+
        '<div class="inp-row"><label>去脂体重</label><input type="number" step="0.1" id="inFFM" placeholder="57.7" value="'+(lb.ffm!=null?lb.ffm:'')+'"><span style="font-size:12px;color:var(--text-3)">kg</span></div>'+
        '<button class="btn-save" onclick="saveBody()">保存到 '+localTodayStr().slice(5).replace('-','/')+'</button>'+
        '<div class="recent-line">最近记录<br>'+recent+'</div>'+
      '</div></details>'+
    '<details class="entry"><summary>📏 腰围<span class="hint">'+(lb.waist!=null?lb.waist+'cm':'未记录')+'</span></summary>'+
      '<div class="entry-body">'+
        '<div class="inp-row"><label>腰围</label><input type="number" step="0.5" id="inWaist" placeholder="86.5" value="'+(lb.waist!=null?lb.waist:'')+'"><span style="font-size:12px;color:var(--text-3)">cm</span></div>'+
        '<button class="btn-save" onclick="saveWaist()">保存到 '+localTodayStr().slice(5).replace('-','/')+'</button>'+
        '<div class="recent-line">同一部位、同一时间量（早起空腹、肚脐水平）</div>'+
      '</div></details>';
}
function saveBody(){
  const w=parseFloat($id('inW').value),bf=parseFloat($id('inBF').value),ffm=parseFloat($id('inFFM').value);
  const o={};
  if(!isNaN(w)&&w>0)o.weight=w;
  if(!isNaN(bf)&&bf>0)o.bf=bf;
  if(!isNaN(ffm)&&ffm>0)o.ffm=ffm;
  if(!Object.keys(o).length){toast('至少填一项');return;}
  saveBodyFields(o);
}
function saveWaist(){
  const v=parseFloat($id('inWaist').value);
  if(isNaN(v)||v<=0){toast('填个腰围');return;}
  saveBodyFields({waist:v});
}

// ===================== 训练计划 =====================
let curPlan=0;
function setPlan(i){curPlan=i;renderPlan();}
function renderPlan(){
  const tabs=PLAN.map(function(p,i){
    const on=i===curPlan;
    return '<div onclick="setPlan('+i+')" style="flex:1;text-align:center;padding:10px 0;border-radius:11px;cursor:pointer;user-select:none;font-size:14px;font-weight:'+(on?'700':'500')+';'+
      (on?'background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(0,122,255,.3)':'background:var(--card);color:var(--text-2);border:1px solid var(--bdr)')+'">'+p.name+'</div>';
  }).join('');
  let html='<div style="display:flex;gap:8px;margin:4px 0 14px">'+tabs+'</div>';
  const p=PLAN[curPlan];
  html+='<div class="plan-card">'+
    '<div class="plan-head"><div>'+
      '<div class="plan-name">'+p.name+'日</div>'+
      '<div class="plan-focus">'+p.focus+'</div>'+
    '</div><div class="plan-dur">'+p.dur+'</div></div>'+
    '<div class="plan-sec">热身</div>'+
    '<div style="font-size:11.5px;color:var(--text-2);line-height:1.7">'+p.warm+'</div>'+
    '<div class="plan-sec">力量</div>';
  p.main.forEach(function(m,i){
    html+='<div class="act-item"><div class="act-idx">'+(i+1)+'</div><div class="act-body">'+
      '<div class="act-name">'+m.n+'</div>'+
      '<div class="act-spec">'+m.s+(m.w?' · '+m.w:'')+'</div>'+
      '<div class="act-tip">'+m.t+'</div>'+
    '</div></div>';
  });
  html+='<div class="plan-foot">冷身：'+p.cd+'</div></div>';
  $id('planArea').innerHTML=html;
}

// ===================== 愿望清单 =====================
const WISH_KEY='wb_wish';
const WISH_SEED=[
  {icon:'👓',name:'林德伯格眼镜框（5选1）',status:'待购入',priority:'高',price:'2000-3000',note:'Strip Titanium 9859 眉线框首选；Blok Titanium 4256 方框备选。颜色 U9 哑光黑或深枪灰，中号 50mm。南京/上海试框记型号 → 香港买框+内地配镜片',timing:'2026 双11'},
  {icon:'🔬',name:'蔡司新清锐 1.60 铂金膜',status:'待购入',priority:'高',price:'500-700',note:'5 年满意度已验证，膜层耐用。度数 325/350 无散光。智锐有大折扣则优先智锐',timing:'与镜框同步'},
  {icon:'🌿',name:'Coral Aria 大地调扩香精油 200ml',status:'待购入',priority:'高',price:'~400',note:'阿联酋品牌，最接近大地原版的替代。需配扩香机，建议先试小样',timing:'观夏用完再买'}
];
function getWish(){
  try{
    const a=JSON.parse(localStorage.getItem(WISH_KEY)||'null');
    if(Array.isArray(a))return a;
  }catch(e){}
  const seed=WISH_SEED.slice();
  try{localStorage.setItem(WISH_KEY,JSON.stringify(seed));}catch(e){}
  return seed;
}
function setWish(a){localStorage.setItem(WISH_KEY,JSON.stringify(a));}
function renderWish(){
  const list=getWish();
  let html='<div class="card" style="margin-top:12px"><div class="card-title">🎯 愿望清单</div>'+
    '<div style="font-size:11.5px;color:var(--text-3);margin-bottom:12px">想买的、计划买的，想好了再下手</div>';
  if(!list.length)html+='<div style="text-align:center;color:var(--text-3);font-size:12px;padding:24px 0">清单是空的</div>';
  list.forEach(function(it,i){
    const bc=it.priority==='高'?'var(--red)':it.priority==='中'?'var(--orange)':'var(--text-3)';
    html+='<div style="background:var(--inset);border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid '+bc+'">'+
      '<div style="display:flex;align-items:flex-start;gap:9px">'+
        '<span style="font-size:20px;flex-shrink:0">'+(it.icon||'•')+'</span>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:14px;font-weight:600;color:var(--text)">'+esc(it.name)+'</div>'+
          '<div style="font-size:11px;color:var(--text-3);margin-top:2px">'+(it.price?'预算 ¥'+esc(it.price):'')+(it.timing?' · '+esc(it.timing):'')+'</div>'+
          (it.note?'<div style="font-size:11.5px;color:var(--text-2);line-height:1.65;margin-top:6px">'+esc(it.note)+'</div>':'')+
        '</div>'+
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">'+
          '<span style="font-size:10px;padding:2px 8px;border-radius:9px;background:rgba(0,0,0,0.05);color:'+bc+';font-weight:600">'+esc(it.status||'待定')+'</span>'+
          '<span onclick="delWish('+i+')" style="font-size:11px;color:var(--text-3);cursor:pointer;padding:2px 4px">删除</span>'+
        '</div>'+
      '</div></div>';
  });
  html+='<button onclick="toggleWishForm()" style="width:100%;padding:11px;background:var(--card);border:1px dashed var(--bdr2);border-radius:10px;color:var(--text-2);font-size:13px;cursor:pointer;margin-top:4px">＋ 手动添加一项</button>'+
    '<div id="wishForm" style="display:none;margin-top:12px;background:var(--inset);border-radius:10px;padding:14px">'+
      '<div class="inp-row"><label>名称</label><input type="text" id="wName" placeholder="想买的东西"></div>'+
      '<div class="inp-row"><label>预算</label><input type="text" id="wPrice" placeholder="500-800"></div>'+
      '<div class="inp-row"><label>优先级</label><select id="wPri" style="flex:1;padding:9px 11px;border-radius:8px;font-size:13px"><option value="高">高</option><option value="中">中</option><option value="低">低</option></select></div>'+
      '<div class="inp-row"><label>状态</label><input type="text" id="wStatus" placeholder="待购入" value="待购入"></div>'+
      '<div class="inp-row"><label>时机</label><input type="text" id="wTiming" placeholder="双11 / 年终"></div>'+
      '<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--text-3);margin-bottom:5px">备注</div><textarea id="wNote" placeholder="型号、渠道、注意事项" style="width:100%;height:70px;background:var(--card);border:1px solid var(--bdr2);border-radius:8px;padding:9px;font-size:12px;color:var(--text);outline:none;resize:vertical;font-family:inherit"></textarea></div>'+
      '<button class="btn-save" onclick="addWish()">加入清单</button>'+
    '</div></div>';
  $id('wishArea').innerHTML=html;
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleWishForm(){
  const f=$id('wishForm');
  f.style.display=f.style.display==='none'?'block':'none';
}
function addWish(){
  const name=($id('wName').value||'').trim();
  if(!name){toast('填个名称');return;}
  const list=getWish();
  list.unshift({
    icon:'🛒',name:name,status:($id('wStatus').value||'待购入').trim(),
    priority:$id('wPri').value,price:($id('wPrice').value||'').trim(),
    note:($id('wNote').value||'').trim(),timing:($id('wTiming').value||'').trim()
  });
  setWish(list);renderWish();toast('已加入清单');
}
function delWish(i){
  const list=getWish();
  if(!confirm('删除「'+list[i].name+'」？'))return;
  list.splice(i,1);setWish(list);renderWish();
}

// ===================== 启动 =====================
function init(){
  const now=new Date();
  $id('headerDate').textContent=localTodayStr()+' 周'+'日一二三四五六'[now.getDay()];
  renderGoal();renderEntry();renderPlan();
  renderPZRecommend();renderPZDetail();renderPZInfo();
  renderWish();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
